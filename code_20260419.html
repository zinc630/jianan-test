            height: 100%;
            background: #b48b5a;

        }

            color: #3e2a1f;

        .option {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            background: #fff;
            padding: 14px 18px;
            border-radius: 48px;
            border: 1px solid #e7d9cb;
            cursor: pointer;
            transition: 0.2s;

        input[type="radio"] {
            margin-top: 5px;
            accent-color: #9b6e42;
            transform: scale(1.15);
            pointer-events: none;
        }
        .btn-group {display: flex;gap: 15px;margin-top: 20px;}
        button {
            flex: 1;
            background: #9b6e42;
            border: none;
            color: #fff;
            font-size: 1rem;
            padding: 12px 0;
            border-radius: 48px;
            cursor: pointer;
            transition: 0.2s;
        }
        button.prev-btn {background: #c0a080;}
        button.finish-btn {background: #a0522d;}

            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            padding: 15px;
            transition: 0.2s;
        }
        .modal-mask.active {visibility: visible;opacity: 1;}
        .modal-container {
            background: #fffef5;
            max-width: 520px;
            width: 100%;
            border-radius: 28px;
            padding: 25px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .radar-box {width: 300px;height: 300px;margin: 10px auto;}
        .type-tag {font-size: 16px;color: #9b6e42;margin: 8px 0;}
        .history-name {
            font-size: 1.5rem;
            font-weight: bold;
            color: #6b3e26;
            margin: 10px 0;
        }
        .poem-block{
            text-align: center;
            line-height: 1.8;
            margin: 12px 0;
            padding: 12px;
            background: #f0e6d2;
            border-radius: 16px;
            font-style: italic;
            color: #8c5d2b;
        }
        .intro-block,.trait-block,.score-list {
            text-align: left;
            line-height: 1.8;
            margin: 12px 0;
            padding: 12px;
            background: #f8f1e4;
            border-radius: 16px;
        }

            font-weight: bold;
            margin-bottom: 10px;
            color: #9b6e42;
        }
        .close-wrap{
            text-align: center;
            margin-top: 15px;
        }
        .close-modal {
            padding: 10px 28px;
            display: inline-block;
        }
        .q-item {display: none;}
        .q-item.active {display: block;}

        .score-item {margin: 8px 0;}
        .score-top {display: flex;justify-content: space-between;font-size: 14px;margin-bottom: 4px;}
        .bar-bg {
            width: 100%;
            height: 8px;
            background: #e0d4c2;
            border-radius: 4px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            background: #9b6e42;
            border-radius: 4px;
            transition: 0.5s ease;
        }
    </style>
</head>

    ESTP:{name:"夏侯惇",title:"刚烈猛将",poem:"拔矢啖睛尤血战，一生忠勇定中原。",desc:"曹魏忠勇猛将，性情豪迈，行事干脆。",trait:"Se主导+Te辅助，行动力爆炸、直率刚烈、临场强悍、务实洒脱。"},
    ESFP:{name:"曹彰",title:"北地虎将",desc:"骁勇好武，心性纯粹直白，不喜权谋。",trait:"Se主导+Fe辅助，热情外放、活在当下、直白温柔、自由不羁。"},
    ENTP:{name:"孔融",title:"傲骨名士",poem:"言直轻权贵，名高振汉庭。",desc:"汉末清流名士，刚直敢言，才思敏捷。",trait:"Ne主导+Ti辅助，思维跳脱、言辞犀利、叛逆敢言、脑洞开阔。"},
    ENFP:{name:"杨修",title:"风流才子",poem:"才高多敏思，性傲误平生。",desc:"恃才放旷，灵动敏感，才情斐然。",trait:"Ne主导+Fi辅助，灵感充沛、感性敏锐、个性张扬、理想浪漫。"}
};

let currentPage = 0;
const totalQ = questionsData.length;
const answerRecord = {};

function renderAllQuestion(){
    const wrap = document.getElementById("questionsWrap");
    wrap.innerHTML = "";
    questionsData.forEach((q,idx)=>{
        const div = document.createElement("div");
        div.className = `q-item ${idx===0?'active':''}`;
        let optHtml = '';
        q.opts.forEach((o,i)=>{
            optHtml += `
            <div class="option" data-idx="${i}" data-qid="${idx}">
                <input type="radio" name="q${idx}" id="q${idx}${i}" value="${i}">
                <label for="q${idx}${i}">${o}</label>
            </div>
            `;
        });
        div.innerHTML = `
        <div class="question-card">
            <div class="question-text">${q.text}</div>
            <div class="options">${optHtml}</div>
        </div>`;
        wrap.appendChild(div);
    });
    bindOptionClick();
}

// 绑定整块选项点击
function bindOptionClick(){
    document.querySelectorAll(".option").forEach(item=>{
        item.addEventListener("click",function(){
            const qid = this.dataset.qid;
            const idx = this.dataset.idx;
            const radio = document.querySelector(`input[name="q${qid}"][value="${idx}"]`);
            radio.checked = true;
            answerRecord[qid] = Number(idx);
            // 最后一题直接出结果
            if(currentPage >= totalQ - 1){
                calcResult();
            }else{
                nextPage();
            }
        })
    })
}

// 查看结果按钮
document.getElementById("nextBtn").addEventListener("click",function(){
    if(currentPage >= totalQ - 1){
        calcResult();
    }else{
        nextPage();
    }
});

function updateUI(){
    document.getElementById("pageTip").innerText = `第 ${currentPage+1}/${totalQ} 题`;
    document.getElementById("progressBar").style.width = `${(currentPage+1)/totalQ*100}%`;
    document.querySelectorAll(".q-item").forEach((item,i)=>{
        item.classList.toggle("active",i===currentPage);
    });
    const nextBtn = document.getElementById("nextBtn");
    if(currentPage === totalQ - 1){
        nextBtn.innerText = "查看结果 📜";
        nextBtn.classList.add("finish-btn");
    }else{
        nextBtn.innerText = "下一题 →";
        nextBtn.classList.remove("finish-btn");
    }
    // 回填已选答案
    if(answerRecord[currentPage] !== undefined){
        document.querySelector(`input[name="q${currentPage}"][value="${answerRecord[currentPage]}"]`).checked = true;
    }
}

function prevPage(){if(currentPage>0){currentPage--;updateUI();}}
function nextPage(){currentPage++;updateUI();}

// 计算荣格八维分数 0-100%
function calcResult(){
    let Ti=0,Te=0,Fi=0,Fe=0;
    let Ni=0,Ne=0,Si=0,Se=0;

    for(let i=0;i<totalQ;i++){
        let v = answerRecord[i];
        if(v === undefined) continue;
        let d = questionsData[i].dim;
        let s = questionsData[i].scores[v];
        switch(d){
            case "Ti":Ti+=s.Ti;break;
            case "Te":Te+=s.Te;break;
            case "Fi":Fi+=s.Fi;break;
            case "Fe":Fe+=s.Fe;break;
            case "Ni":Ni+=s.Ni;break;
            case "Ne":Ne+=s.Ne;break;
            case "Si":Si+=s.Si;break;
            case "Se":Se+=s.Se;break;
        }
    }

    const maxSingle = 12;
    const score = {
        Ti:Math.round((Ti+maxSingle)/maxSingle*50),
        Te:Math.round((Te+maxSingle)/maxSingle*50),
        Fi:Math.round((Fi+maxSingle)/maxSingle*50),
        Fe:Math.round((Fe+maxSingle)/maxSingle*50),
        Ni:Math.round((Ni+maxSingle)/maxSingle*50),
        Ne:Math.round((Ne+maxSingle)/maxSingle*50),
        Si:Math.round((Si+maxSingle)/maxSingle*50),
        Se:Math.round((Se+maxSingle)/maxSingle*50)
    };

    // MBTI判定
    let E = score.Te > score.Si || score.Fe > score.Si;
    let N = score.Ni > score.Si || score.Ne > score.Si;
    let T = score.Ti > score.Fi || score.Te > score.Fe;
    let J = score.Te > score.Ne || score.Si > score.Ne;

    let code = (E?"E":"I") + (N?"N":"S") + (T?"T":"F") + (J?"J":"P");
    drawOctRadar(score,code);
}

// 八边形雷达图
function drawOctRadar(score,code){
    const info = personMap[code];
    const canvas = document.createElement("canvas");
    canvas.width = 300;
    canvas.height = 300;
    const ctx = canvas.getContext("2d");
    const cx = 150, cy = 150, r = 110;

    const keys = ["Ti","Te","Se","Fi","Fe","Si","Ne","Ni"];
    const nameCn = ["内倾思考","外倾思考","外倾实感","内倾情感","外倾情感","内倾实感","外倾直觉","内倾直觉"];
    const angle = [0,45,90,135,180,225,270,315];

    ctx.strokeStyle = "#ddd";
    for(let d=0.2;d<=1;d+=0.2){
        drawOct(ctx,cx,cy,r*d);
    }

    ctx.fillStyle = "#6b3e26";
    ctx.font = "13px sans-serif";
    keys.forEach((k,i)=>{
        let rad = angle[i] * Math.PI / 180;
        let x = cx + Math.cos(rad) * (r+18);
        let y = cy + Math.sin(rad) * (r+18);
        ctx.textAlign="center";
        ctx.textBaseline="middle";
        ctx.fillText(nameCn[i],x,y);
        ctx.beginPath();
        ctx.moveTo(cx,cy);
        ctx.lineTo(cx+Math.cos(rad)*r, cy+Math.sin(rad)*r);
        ctx.strokeStyle="#ccc";
        ctx.stroke();
    });

    const val = keys.map(k=>score[k]/100);
    ctx.beginPath();
    val.forEach((v,i)=>{
        let rad = angle[i] * Math.PI / 180;
        let x = cx + Math.cos(rad)*r*v;
        let y = cy + Math.sin(rad)*r*v;
        i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    });
    ctx.closePath();
    ctx.fillStyle = "rgba(180,139,90,0.25)";
    ctx.fill();
    ctx.strokeStyle = "#9b6e42";
    ctx.lineWidth = 2;
    ctx.stroke();

    // 八维进度条
    let scoreHtml = "";
    const list = [
        {k:"Ti",n:"内倾思考"},{k:"Te",n:"外倾思考"},
        {k:"Fi",n:"内倾情感"},{k:"Fe",n:"外倾情感"},
        {k:"Ni",n:"内倾直觉"},{k:"Ne",n:"外倾直觉"},
        {k:"Si",n:"内倾实感"},{k:"Se",n:"外倾实感"}
    ];
    list.forEach(item=>{
        let per = score[item.k];
        scoreHtml += `
        <div class="score-item">
            <div class="score-top">
                <span>${item.n}(${item.k})</span>
                <span>${per}%</span>
            </div>
            <div class="bar-bg">
                <div class="bar-fill" style="width:${per}%"></div>
            </div>
        </div>
        `;
    });

    const html = `
        <div class="type-tag">你的MBTI人格：${code}</div>
        <div class="history-name">${info.name} · ${info.title}</div>
        ${info.poem ? `<div class="poem-block">「${info.poem}」</div>` : ""}
        <div class="radar-box"></div>

        <div class="score-list">
            <div class="title-sm">📊 荣格八维百分比数值</div>
            ${scoreHtml}
        </div>

        <div class="intro-block">
            <div class="title-sm">📜 对应历史人物简介</div>
            <div>${info.desc}</div>
        </div>

        <div class="trait-block">
            <div class="title-sm">✨ 八维核心人格特质</div>
            <div>${info.trait}</div>
        </div>

        <div class="close-wrap">
            <button class="close-modal" onclick="closeModal()">关闭</button>
        </div>
    `;
    document.getElementById("modalContent").innerHTML = html;
    document.querySelector(".radar-box").appendChild(canvas);
    document.getElementById("resultModal").classList.add("active");
}

// 绘制八边形
function drawOct(ctx,x,y,r){
    ctx.beginPath();
    for(let i=0;i<8;i++){
        let rad = (45*i) * Math.PI / 180;
        let px = x + Math.cos(rad)*r;
        let py = y + Math.sin(rad)*r;
        i===0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
    }
    ctx.closePath();
    ctx.stroke();
}

window.closeModal = function(){
    document.getElementById("resultModal").classList.remove("active");
}

document.getElementById("prevBtn").onclick = prevPage;

// 初始化
renderAllQuestion();
updateUI();
</script>
</body>
